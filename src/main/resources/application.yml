spring:
  application:
    name: sgs-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sgs?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  timezone: Asia/Kolkata
  trust-proxy-headers: ${TRUST_PROXY_HEADERS:true}
  jwt:
    secret: ${JWT_SECRET}
    expiry: 8h
  cookie:
    name: SGS_AUTH
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CORS_ORIGINS:}
#  storage:
#    root: ${STORAGE_ROOT:/data/uploads}
#    public-base-url: ${PUBLIC_FILES_URL:https://localhost:8081/files}
#    serve-files: ${SERVE_FILES:false}
#    max-file-bytes: 6291456
  storage:
    root: ${STORAGE_ROOT:/data/uploads}
    public-base-url: ${PUBLIC_FILES_URL:http://localhost:8081/files}
    serve-files: ${SERVE_FILES:true}
    max-file-bytes: 6291456
  bootstrap:
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-full-name: ${ADMIN_FULL_NAME:Administrator}
  limits:
    service-images: 8
    login-max-failures: 5
    login-window: 15m
    inquiries-per-hour: 5
    max-bank-amount: 10000000
  turnstile:
    secret: ${TURNSTILE_SECRET:}
