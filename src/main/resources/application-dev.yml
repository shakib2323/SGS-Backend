# Local development only.
# Run with: --spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sgs?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret-0000}

  cookie:
    secure: false
    same-site: Lax

  cors:
    allowed-origins:
      - "http://localhost:5500"
      - "http://127.0.0.1:5500"
      - "http://localhost:5501"
      - "http://127.0.0.1:5501"
      - "http://localhost:3000"

  storage:
    root: ./uploads
    public-base-url: http://localhost:8081/files
    serve-files: true

  bootstrap:
    admin-username: admin
    admin-password: Shakib@12345
