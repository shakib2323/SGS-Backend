# Production stack: Caddy (HTTPS, static /files) -> Spring Boot API -> MySQL.
# Only Caddy publishes ports; MySQL and the API are reachable only on the internal network.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sgs
      MYSQL_USER: sgs
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
      - --performance-schema=OFF
      - --max-connections=40
      - --skip-name-resolve
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  api:
    image: ghcr.io/${GHCR_OWNER}/sgs-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sgs?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: sgs
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_ROOT: /data/uploads
      SERVE_FILES: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -Djava.awt.headless=true
    mem_limit: ${API_MEM_LIMIT:-640m}
    volumes:
      - uploads:/data/uploads
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
